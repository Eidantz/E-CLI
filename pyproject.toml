[project]
name = "e-cli"
version = "0.2.0"
description = "E-CLI is an advanced command-line assistant designed to translate natural language queries into executable bash/Zsh commands."
authors = [{ name = "Eidan Tzdaka" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dspy>=2.6.15,<3.0.0",
    "distro>=1.9.0,<2.0.0",
    "psutil>=5.9.0,<6.0.0",
]

[project.scripts]
ecli = "ecli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
